name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find and Prepare APK
        id: apk_info
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_FILE"
          
          # Copy to a clean standard name
          mkdir -p dist
          cp "$APK_FILE" dist/RosioriMap-v1.0.0-debug.apk
          echo "apk_path=dist/RosioriMap-v1.0.0-debug.apk" >> $GITHUB_OUTPUT
          echo "apk_filename=RosioriMap-v1.0.0-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RosioriMap-Android-APK
          path: ${{ steps.apk_info.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Roșiori Map v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          body: |
            ## Roșiori Map – Android APK Release
            
            Noua versiune a aplicației pentru restaurante și rezervări din **Roșiorii de Vede**:
            - 🍽️ **Meniuri complete & autentice** pentru toate restaurantele, pizzeriile, fast-food-urile, patiseriile și cafenelele locale.
            - 🗺️ **Harta OpenStreetMap integrată fără cheie API**, plus posibilitate de personalizare în setări.
            - 🔍 **Căutare inteligentă** în preparate și categorii de meniu.
            - 📱 **Integrare nativă Android**: apelare telefonică directă, traseu prin Google Maps/Waze, partajare rapidă și funcționare offline.
            
            ### Descărcare:
            Descarcă fișierul **`RosioriMap-v1.0.0-debug.apk`** de mai jos și instalează-l pe telefonul tău Android.
          files: ${{ steps.apk_info.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
