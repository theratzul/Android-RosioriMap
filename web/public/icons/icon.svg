<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Vibrant Royal Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <!-- Soft Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle on blue -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Centered Letter R -->
  <g filter="url(#softShadow)" fill="#ffffff">
    <!-- Vertical stem of R -->
    <rect x="57" y="44" width="18" height="104" rx="3" />
    <!-- Loop of R -->
    <path d="M75 44 h28 c18 0 32 12.5 32 30 s-14 30 -32 30 h-28 Z M75 60 h26 c9 0 16 6 16 14 s-7 14 -16 14 h-26 Z" fill-rule="evenodd" />
    <!-- Diagonal leg of R -->
    <polygon points="91,100 107,100 135,148 117,148" />
  </g>
</svg>
