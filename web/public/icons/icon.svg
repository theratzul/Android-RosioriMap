<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Celestial Deep Sapphire Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2356" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#091430" />
    </linearGradient>
    <!-- Antique Gold Gradient for Cross -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="celestialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="4" y="4" width="184" height="184" rx="42" fill="url(#bgGrad)" stroke="#e5c07b" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Subtle inner ambient halo ring -->
  <circle cx="96" cy="96" r="76" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="3 3" fill="none" />

  <!-- Sacred Cross (Left side) -->
  <g filter="url(#celestialGlow)">
    <!-- Vertical beam of the Cross -->
    <rect x="58" y="42" width="14" height="108" rx="3" fill="url(#goldGrad)" />
    <!-- Horizontal beam of the Cross -->
    <rect x="36" y="68" width="58" height="14" rx="3" fill="url(#goldGrad)" />
    
    <!-- Cross finial ornaments -->
    <circle cx="65" cy="42" r="3.5" fill="#fde68a" />
    <circle cx="65" cy="150" r="3.5" fill="#fde68a" />
    <circle cx="36" cy="75" r="3.5" fill="#fde68a" />
    <circle cx="94" cy="75" r="3.5" fill="#fde68a" />
  </g>

  <!-- Letter R from Roșiori (Right side) -->
  <g filter="url(#celestialGlow)">
    <!-- Vertical stem of R -->
    <rect x="108" y="42" width="16" height="108" rx="3" fill="#ffffff" />
    <!-- Loop of R -->
    <path d="M124 42 h20 c15.5 0 28 11.5 28 27 s-12.5 27 -28 27 h-20 Z M124 56 h18 c7.5 0 14 5.5 14 13 s-6.5 13 -14 13 h-18 Z" fill="#ffffff" fill-rule="evenodd" />
    <!-- Diagonal leg of R -->
    <polygon points="134,92 148,92 174,150 158,150" fill="#ffffff" />
  </g>

  <!-- Connecting golden star / divine ember -->
  <circle cx="101" cy="96" r="3.5" fill="#fbbf24" opacity="0.9" />
</svg>
