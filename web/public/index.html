<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Roșiori Map – Restaurante și rezervări în Roșiorii de Vede</title>
  <meta name="description" content="Harta interactivă a restaurantelor din Roșiorii de Vede: vezi meniul, programul și fă rezervări online în câteva secunde." />
  <meta name="theme-color" content="#1a0b14" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="heaven-rays" aria-hidden="true"></div>
  <header class="topbar glass">
    <div class="brand">
      <img src="icons/icon.svg" alt="Roșiori Map Logo" class="brand-logo" width="40" height="40" />
      <div>
        <h1 class="brand-title">Roșiori Map</h1>
        <p class="tagline">Restaurante · Meniuri · Rezervări</p>
      </div>
    </div>
    <nav class="top-actions">
      <button id="btn-my-res" class="chip" type="button" aria-label="Rezervările mele">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 16H5V10h14v10ZM7 12h5v5H7z"/></svg>
        <span>Rezervările mele</span>
      </button>
      <button id="btn-menu" class="chip menu-btn" type="button" aria-label="Menu" title="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" class="menu-sacred-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="3" x2="12" y2="21" stroke="var(--accent)" stroke-width="1.6" />
          <line x1="6.5" y1="9.5" x2="17.5" y2="9.5" stroke="var(--accent)" stroke-width="1.6" />
          <path d="M4 8.5c2.5-3 5-3.5 8-3.5s5.5.5 8 3.5" stroke="currentColor" stroke-width="1.2" opacity="0.8" />
          <path d="M4 14.5c2.5 3 5 3.5 8 3.5s5.5-.5 8-3.5" stroke="currentColor" stroke-width="1.2" opacity="0.8" />
        </svg>
        <span class="menu-label">Menu</span>
      </button>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar glass" id="sidebar">
      <div class="sheet-handle" id="sheet-handle" aria-hidden="true"></div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" class="search-ico"><path fill="currentColor" d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5Zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Z"/></svg>
        <input id="search" type="search" placeholder="Caută restaurant, preparat…" autocomplete="off" />
      </div>
      <div class="filters" id="filters" role="tablist"></div>
      <p class="result-count" id="result-count"></p>
      <ul class="list" id="list"></ul>
      <footer class="sidebar-footer" id="sidebar-footer" role="button" tabindex="0" title="Despre autor și aplicație">
        <div class="sacred-monogram">☩</div>
        <span>Dezvoltat de <strong>Popa Bogdan (theratzul)</strong></span>
        <span class="sidebar-footer-tag">devops · linux admin · christian</span>
      </footer>
    </aside>
    <section class="map-wrap">
      <div id="map" aria-label="Harta Roșiorii de Vede"></div>
      <div class="map-brand-badge glass" id="map-brand-badge" title="Roșiori de Vede">
        <img src="icons/icon.svg" alt="Roșiori Map Icon" width="28" height="28" class="map-badge-img" />
        <span class="map-badge-label">Roșiori de Vede</span>
      </div>
      <button id="btn-locate" class="fab" type="button" aria-label="Locația mea">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.1A7 7 0 0 0 13 5.1V3h-2v2.1A7 7 0 0 0 5.1 11H3v2h2.1a7 7 0 0 0 5.9 5.9V21h2v-2.1a7 7 0 0 0 5.9-5.9H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
      </button>
    </section>
  </main>

  <!-- Restaurant detail drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <article class="drawer glass" id="drawer" aria-hidden="true">
    <button class="icon-btn drawer-close" id="drawer-close" type="button" aria-label="Închide">✕</button>
    <div id="drawer-content"></div>
  </article>

  <!-- Generic modal -->
  <dialog id="modal" class="modal glass">
    <button class="icon-btn modal-close" id="modal-close" type="button" aria-label="Închide">✕</button>
    <div id="modal-content"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
